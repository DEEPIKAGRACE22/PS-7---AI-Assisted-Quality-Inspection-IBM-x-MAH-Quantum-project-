<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1060" viewBox="0 0 1220 1060" font-family="Liberation Sans, Helvetica, Arial, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#000"/></marker></defs><rect width="1220" height="1060" fill="#fff"/><text x="40" y="26" font-size="15" font-weight="bold" font-style="normal" text-anchor="start" dominant-baseline="central" fill="#000" >Fig. 2   Video processing pipeline</text><line x1="40" y1="42" x2="1180" y2="42" stroke="#000" stroke-width="1.5"/><rect x="40" y="58" width="300" height="932" fill="#fff" stroke="#000" stroke-width="1"/><rect x="40" y="58" width="300" height="26" fill="#000"/><text x="190.0" y="71" font-size="11" font-weight="bold" font-style="normal" text-anchor="middle" dominant-baseline="central" fill="#fff" letter-spacing="1">DASHBOARD (BROWSER)</text><rect x="340" y="58" width="300" height="932" fill="#fff" stroke="#000" stroke-width="1"/><rect x="340" y="58" width="300" height="26" fill="#000"/><text x="490.0" y="71" font-size="11" font-weight="bold" font-style="normal" text-anchor="middle" dominant-baseline="central" fill="#fff" letter-spacing="1">FASTAPI BACKEND</text><rect x="640" y="58" width="540" height="932" fill="#fff" stroke="#000" stroke-width="1"/><rect x="640" y="58" width="540" height="26" fill="#000"/><text x="910.0" y="71" font-size="11" font-weight="bold" font-style="normal" text-anchor="middle" dominant-baseline="central" fill="#fff" letter-spacing="1">BACKGROUND WORKER (INFERENCE THREAD)</text><rect x="65.0" y="112.0" width="250" height="56" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="190.0" y="132.16" font-size="13" font-weight="bold" font-style="normal" text-anchor="middle" dominant-baseline="central" fill="#000" >Select video</text><text x="190.0" y="150.64" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" dominant-baseline="central" fill="#000" >set confidence threshold</text><rect x="65.0" y="197.0" width="250" height="56" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="190.0" y="217.16" font-size="13" font-weight="bold" font-style="normal" text-anchor="middle" dominant-baseline="central" fill="#000" >Upload video</text><text x="190.0" y="235.64" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" dominant-baseline="central" fill="#000" >POST /inspections/upload/video</text><rect x="65.0" y="377.0" width="250" height="56" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="190.0" y="397.16" font-size="13" font-weight="bold" font-style="normal" text-anchor="middle" dominant-baseline="central" fill="#000" >Subscribe to events</text><text x="190.0" y="415.64" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" dominant-baseline="central" fill="#000" >WebSocket, plus 2 s polling</text><rect x="65.0" y="647.0" width="250" height="56" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="190.0" y="667.16" font-size="13" font-weight="bold" font-style="normal" text-anchor="middle" dominant-baseline="central" fill="#000" >Live feedback</text><text x="190.0" y="685.64" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" dominant-baseline="central" fill="#000" >progress bar, defect alert</text><rect x="65.0" y="917.0" width="250" height="56" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="190.0" y="937.16" font-size="13" font-weight="bold" font-style="normal" text-anchor="middle" dominant-baseline="central" fill="#000" >Review result</text><text x="190.0" y="955.64" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" dominant-baseline="central" fill="#000" >annotated video, timeline, CSV</text><rect x="365.0" y="197.0" width="250" height="56" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="490.0" y="217.16" font-size="13" font-weight="bold" font-style="normal" text-anchor="middle" dominant-baseline="central" fill="#000" >Validate and store</text><text x="490.0" y="235.64" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" dominant-baseline="central" fill="#000" >type check, 500 MB cap, save</text><rect x="365.0" y="287.0" width="250" height="56" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="490.0" y="307.16" font-size="13" font-weight="bold" font-style="normal" text-anchor="middle" dominant-baseline="central" fill="#000" >Register inspection</text><text x="490.0" y="325.64" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" dominant-baseline="central" fill="#000" >OpenCV probe, DB row PROCESSING</text><rect x="365.0" y="377.0" width="250" height="56" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="490.0" y="397.16" font-size="13" font-weight="bold" font-style="normal" text-anchor="middle" dominant-baseline="central" fill="#000" >Start background task</text><text x="490.0" y="415.64" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" dominant-baseline="central" fill="#000" >returns inspection id</text><rect x="365.0" y="647.0" width="250" height="56" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="490.0" y="667.16" font-size="13" font-weight="bold" font-style="normal" text-anchor="middle" dominant-baseline="central" fill="#000" >Progress update</text><text x="490.0" y="685.64" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" dominant-baseline="central" fill="#000" >DB write, WebSocket event</text><rect x="690.0" y="381.0" width="180" height="48" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="780.0" y="405.0" font-size="13" font-weight="bold" font-style="normal" text-anchor="middle" dominant-baseline="central" fill="#000" >Read next frame</text><polygon points="780,457 880,495 780,533 680,495" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="780" y="495" font-size="12" font-weight="bold" font-style="normal" text-anchor="middle" dominant-baseline="central" fill="#000" >Stride frame?</text><rect x="685.0" y="563.0" width="190" height="44" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="780.0" y="585.0" font-size="13" font-weight="bold" font-style="normal" text-anchor="middle" dominant-baseline="central" fill="#000" >Reuse previous boxes</text><rect x="680.0" y="647.0" width="200" height="56" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="780.0" y="667.16" font-size="13" font-weight="bold" font-style="normal" text-anchor="middle" dominant-baseline="central" fill="#000" >Annotate and write frame</text><text x="780.0" y="685.64" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" dominant-baseline="central" fill="#000" >boxes, labels, HUD, time</text><polygon points="780,727 880,765 780,803 680,765" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="780" y="765" font-size="12" font-weight="bold" font-style="normal" text-anchor="middle" dominant-baseline="central" fill="#000" >More frames?</text><rect x="940.0" y="467.0" width="200" height="56" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="1040.0" y="487.16" font-size="13" font-weight="bold" font-style="normal" text-anchor="middle" dominant-baseline="central" fill="#000" >YOLO11n inference</text><text x="1040.0" y="505.64" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" dominant-baseline="central" fill="#000" >640 px, conf 0.25</text><rect x="940.0" y="737.0" width="200" height="56" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="1040.0" y="757.16" font-size="13" font-weight="bold" font-style="normal" text-anchor="middle" dominant-baseline="central" fill="#000" >Transcode to H.264</text><text x="1040.0" y="775.64" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" dominant-baseline="central" fill="#000" >ffmpeg, browser-playable</text><rect x="940.0" y="827.0" width="200" height="56" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="1040.0" y="847.16" font-size="13" font-weight="bold" font-style="normal" text-anchor="middle" dominant-baseline="central" fill="#000" >Evaluate quality rules</text><text x="1040.0" y="865.64" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" dominant-baseline="central" fill="#000" >approved, review, rejected</text><rect x="940.0" y="917.0" width="200" height="56" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="1040.0" y="937.16" font-size="13" font-weight="bold" font-style="normal" text-anchor="middle" dominant-baseline="central" fill="#000" >Persist and complete</text><text x="1040.0" y="955.64" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" dominant-baseline="central" fill="#000" >defects to DB, COMPLETED</text><path d="M190 168 L190 197" fill="none" stroke="#000" stroke-width="1.2" marker-end="url(#ah)"/><path d="M315.0 225 L365.0 225" fill="none" stroke="#000" stroke-width="1.2" marker-end="url(#ah)"/><path d="M490 253 L490 287" fill="none" stroke="#000" stroke-width="1.2" marker-end="url(#ah)"/><path d="M490 343 L490 377" fill="none" stroke="#000" stroke-width="1.2" marker-end="url(#ah)"/><path d="M365.0 405 L315.0 405" fill="none" stroke="#000" stroke-width="1.2" marker-end="url(#ah)"/><text x="340.0" y="393" font-size="10.5" font-weight="normal" font-style="italic" text-anchor="middle" dominant-baseline="central" fill="#000" >id</text><path d="M615.0 405 L690 405" fill="none" stroke="#000" stroke-width="1.2" marker-end="url(#ah)"/><path d="M780 429 L780 457" fill="none" stroke="#000" stroke-width="1.2" marker-end="url(#ah)"/><path d="M880 495 L940 495" fill="none" stroke="#000" stroke-width="1.2" marker-end="url(#ah)"/><text x="900" y="483" font-size="10.5" font-weight="bold" font-style="normal" text-anchor="middle" dominant-baseline="central" fill="#000" >Yes</text><path d="M780 533 L780 563" fill="none" stroke="#000" stroke-width="1.2" marker-end="url(#ah)"/><text x="792" y="547" font-size="10.5" font-weight="bold" font-style="normal" text-anchor="start" dominant-baseline="central" fill="#000" >No</text><path d="M780 607 L780 647" fill="none" stroke="#000" stroke-width="1.2" marker-end="url(#ah)"/><path d="M1040 523 L1040 675 L880 675" fill="none" stroke="#000" stroke-width="1.2" marker-end="url(#ah)"/><path d="M780 703 L780 727" fill="none" stroke="#000" stroke-width="1.2" marker-end="url(#ah)"/><path d="M680 765 H662 V682 A7 7 0 0 0 662 668 V405" fill="none" stroke="#000" stroke-width="1.2"/><text x="666" y="779" font-size="10.5" font-weight="bold" font-style="normal" text-anchor="start" dominant-baseline="central" fill="#000" >Yes</text><text x="892" y="753" font-size="10.5" font-weight="bold" font-style="normal" text-anchor="middle" dominant-baseline="central" fill="#000" >No</text><path d="M880 765 L940 765" fill="none" stroke="#000" stroke-width="1.2" marker-end="url(#ah)"/><path d="M1040 793 L1040 827" fill="none" stroke="#000" stroke-width="1.2" marker-end="url(#ah)"/><path d="M1040 883 L1040 917" fill="none" stroke="#000" stroke-width="1.2" marker-end="url(#ah)"/><path d="M680 675 L615.0 675" fill="none" stroke="#000" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#ah)"/><path d="M365.0 675 L315.0 675" fill="none" stroke="#000" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#ah)"/><text x="490" y="719" font-size="10.5" font-weight="normal" font-style="italic" text-anchor="middle" dominant-baseline="central" fill="#000" >sent every 10 frames or on a defect</text><path d="M940 945 L315.0 945" fill="none" stroke="#000" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#ah)"/><text x="560" y="931" font-size="11" font-weight="normal" font-style="italic" text-anchor="middle" dominant-baseline="central" fill="#000" >WebSocket event: completed</text><line x1="40" y1="1032" x2="80" y2="1032" stroke="#000" stroke-width="1.2" marker-end="url(#ah)"/><text x="90" y="1032" font-size="11" font-weight="normal" font-style="normal" text-anchor="start" dominant-baseline="central" fill="#000" >Control flow</text><line x1="194.4" y1="1032" x2="234.4" y2="1032" stroke="#000" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#ah)"/><text x="244.4" y="1032" font-size="11" font-weight="normal" font-style="normal" text-anchor="start" dominant-baseline="central" fill="#000" >Asynchronous event or status feedback</text></svg>