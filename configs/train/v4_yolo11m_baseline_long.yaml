# Capacity test: same recipe as v1r (the control), only the model size changes (yolo11n -> yolo11m).
# Any gain over v1r comes from the larger model, not from the schedule or augmentation.
version: v4_yolo11m_baseline_long
description: YOLO11m from COCO weights, v1 augmentation, v1r training schedule.

model: yolo11m.pt
data: data/neu_yolo/data.yaml

train:
  epochs: 100
  imgsz: 640
  batch: 16
  seed: 42
  deterministic: true
  patience: 20
  workers: 2
  optimizer: AdamW   # explicit, because optimizer=auto ignores lr0
  lr0: 0.001
  save_period: 1     # keep a checkpoint of every epoch (last.pt is also rewritten every epoch)

  # Augmentation (same as v1)
  hsv_h: 0.015
  hsv_s: 0.3
  hsv_v: 0.2
  degrees: 3.0
  translate: 0.05
  scale: 0.15
  shear: 1.0
  mosaic: 0.5
  mixup: 0.05
  close_mosaic: 10
  fliplr: 0.5
  flipud: 0.0
