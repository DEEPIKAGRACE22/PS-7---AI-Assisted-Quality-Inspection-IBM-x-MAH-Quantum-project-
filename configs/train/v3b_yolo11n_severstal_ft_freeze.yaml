# Stage B variant: as v3, but the backbone stays frozen so only neck and head adapt to NEU-DET.
# The head is rebuilt for 6 classes; backbone and neck weights are transferred.
version: v3b_yolo11n_severstal_ft_freeze
description: As v3, with the first 10 layers (backbone) frozen.

model: models/v2_yolo11n_severstal_pretrain/weights/best.pt
data: data/neu_yolo/data.yaml

train:
  epochs: 100
  imgsz: 640
  batch: 16
  seed: 42
  deterministic: true
  patience: 20
  workers: 2
  optimizer: AdamW   # explicit, because optimizer=auto ignores lr0
  lr0: 0.001
  save_period: 10
  freeze: 10

  # Augmentation (same as v1)
  hsv_h: 0.015
  hsv_s: 0.3
  hsv_v: 0.2
  degrees: 3.0
  translate: 0.05
  scale: 0.15
  shear: 1.0
  mosaic: 0.5
  mixup: 0.05
  close_mosaic: 10
  fliplr: 0.5
  flipud: 0.0
