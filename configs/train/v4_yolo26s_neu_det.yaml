# v4: YOLO26s fine-tuned from the official COCO checkpoint on NEU-DET.
# No weights from models/ are used. Labels: the audit's "corrected" XMLs are byte-identical
# to the Kaggle originals, so the standard dataset from scripts/prepare_neu_det.py is used.
version: v4_yolo26s_neu_det
description: YOLO26s (COCO pretrained) on NEU-DET, grayscale-tuned augmentation, cosine LR, 150 epochs.

model: yolo26s.pt
data: data/neu_yolo/data.yaml

train:
  epochs: 150
  imgsz: 640
  batch: 32
  seed: 42
  deterministic: true
  patience: 30
  workers: 8
  optimizer: auto
  cos_lr: true
  warmup_epochs: 3
  cache: ram
  amp: true
  save_period: 10

  # Augmentation: grayscale defect textures, no colour cues
  hsv_h: 0.0
  hsv_s: 0.2
  hsv_v: 0.3
  degrees: 5.0
  translate: 0.1
  scale: 0.3
  shear: 1.0
  mosaic: 1.0
  mixup: 0.05
  close_mosaic: 15
  fliplr: 0.5
  flipud: 0.5
